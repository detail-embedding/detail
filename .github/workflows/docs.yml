name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mkdocs-click imports detail.cli, which pulls in cv2 (opencv-python needs libGL).
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      # The built site is handed to the deploy job; only a push to main publishes it.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes main to GitHub Pages (docs/docs_design.md §8). Fails until Pages is
  # turned on with Source "GitHub Actions" in the repository settings.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
