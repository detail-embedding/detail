name: "Set up the test environment"
description: >
  Python 3.12, the system libs headless PyQt6 needs, CPU-only torch, and the project
  with its dev/gui/analysis dependencies — cached. Every test job uses this, so the
  install is written down once instead of copied per job.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    # System libs PyQt6 needs even under the offscreen platform plugin, and libGL for
    # opencv. Cheap enough to install unconditionally; the GUI job is not the only one
    # that imports detail.gui indirectly.
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

    # CPU-only torch first (avoids the multi-GB CUDA wheel). transformers is faked in
    # tests so it is left out, but huggingface_hub is imported for real by the
    # credentials/hf-access tests, so it is installed explicitly. scikit-learn + scipy +
    # numba (from the analysis extra) so syllable-discovery tests run here instead of
    # skipping — numba compiles the DTW clustering kernel; umap is not needed.
    # keypoints_export (h5py, pandas, tables, pynwb, ndx-pose) so the SLEAP, DeepLabCut H5
    # and NWB writers are exercised here rather than offered as unavailable.
    - shell: bash
      run: |
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev,gui,keypoints_export]" huggingface_hub scikit-learn scipy numba
