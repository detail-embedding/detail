name: Bug report
description: Something went wrong. Fill this in from the computer it happened on.
type: Bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Some of what we need disappears when you close windows. If you started DETAIL from a
        terminal, save that window's whole scrollback to a file before you do anything else.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: "Say what state it's in now, too: still running, frozen, or closed."
      placeholder: >-
        The progress bar stopped at 12/50 two hours ago. I expected training to finish in
        about 40 minutes. The window still responds.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or command to reproduce
      description: "If it doesn't happen every time, say how often, for example 2 out of 5 runs."
      placeholder: |
        1. Open the experiment
        2. Train, YOLO, default settings
        3. Leave it running
    validations:
      required: true
  - type: dropdown
    id: launched
    attributes:
      label: How did you run it?
      options:
        - GUI (the DETAIL app)
        - CLI (a detail command in a terminal)
        - Python script or notebook
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: detail doctor output
      description: >-
        In a terminal, run `detail doctor` and paste everything it prints. Don't shorten it.
        It gives your DETAIL version, operating system, Python, GPU, CUDA and package versions.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Run-folder logs
      description: >-
        Drag in `activity.csv`, `worker.log` and, for a multi-recording run,
        `coordinator.log` from the run's folder.
  - type: textarea
    id: terminal
    attributes:
      label: Terminal output
      description: >-
        If you started DETAIL from a terminal, save that window's whole scrollback to a file
        first, then attach it here.
  - type: textarea
    id: ruled-out
    attributes:
      label: What you've ruled out, or a guess at the cause
      description: >-
        What you tried and what it showed. Label guesses as guesses. If one quick check would
        tell two possible causes apart, say what it is.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found one, the exact steps. If you lost data, say so.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues for this problem
          required: true
